name: smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -c requirements-ci.lock -e .[dev]
      - name: Run tests
        run: pytest -q
      - name: Run repository smoke
        run: bash scripts/smoke.sh
      - name: Run installed CLI smoke
        run: bash scripts/installed_cli_smoke.sh
