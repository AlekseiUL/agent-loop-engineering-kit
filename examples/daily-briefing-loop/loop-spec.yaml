schema_version: "1.0"
name: "daily-briefing-loop"
goal: "Create a read-only daily project briefing with sources and open questions."
risk_class: "L1"
trigger:
  type: manual
  schedule: null
  timezone: null
inputs:
  required:
    - "project notes folder"
  optional: []
state:
  backend: receipt
  location: "examples/daily-briefing-loop/run-record.yaml"
  read_before_run: true
  update_after_run: true
tools:
  allowed:
    - read_files
    - search_files
    - write_report
  forbidden_actions:
    - delete_files
    - access_secrets
    - public_posting
    - production_deploy
    - payments
isolation:
  mode: read_only
  notes: "Report only."
verification:
  deterministic_checks:
    - name: report_has_sources
      method: checklist
      pass_condition: sources are listed
  review_checks:
    - name: human_readability
      reviewer: human
      rubric: "Can a human understand the receipt in two minutes?"
  definition_of_done:
    - "receipt written"
    - "no forbidden action attempted"
stop_conditions:
  max_iterations: 1
  max_runtime_minutes: 15
  success_signal: "briefing_with_sources_written"
  failure_policy: "stop_and_report"
  stop_on_repeated_error: true
human_gate:
  required_for:
    - deletion
    - secrets
    - public_posting
    - production_deploy
    - payments
  approval_format: "APPROVE LOOP ACTION: <action> / <scope> / <rollback>"
outputs:
  artifacts:
    - "reports/daily-briefing.md"
receipt:
  required: true
  path: "receipts/daily-briefing.receipt.md"
