schema_version: "1.0"
name: "repo-maintenance-loop"
goal: "Inspect a repository for documentation maintenance issues and produce a report."
risk_class: "L1"
trigger:
  type: manual
  schedule: null
  timezone: null
inputs:
  required:
    - "repository path"
  optional: []
state:
  backend: receipt
  location: "examples/repo-maintenance-loop/run-record.yaml"
  read_before_run: true
  update_after_run: true
tools:
  allowed:
    - read_files
    - search_files
    - run_link_check
    - write_report
  forbidden_actions:
    - delete_files
    - access_secrets
    - public_posting
    - production_deploy
    - payments
isolation:
  mode: read_only
  notes: "Beginner version reports only."
verification:
  deterministic_checks:
    - name: links_checked
      method: link checker or checklist
      pass_condition: broken links are listed or command exits cleanly
  review_checks:
    - name: human_readability
      reviewer: human
      rubric: "Can a human understand the receipt in two minutes?"
  definition_of_done:
    - "receipt written"
    - "no forbidden action attempted"
stop_conditions:
  max_iterations: 1
  max_runtime_minutes: 20
  success_signal: "maintenance_report_written"
  failure_policy: "stop_and_report"
  stop_on_repeated_error: true
human_gate:
  required_for:
    - deletion
    - secrets
    - public_posting
    - production_deploy
    - payments
  approval_format: "APPROVE LOOP ACTION: <action> / <scope> / <rollback>"
outputs:
  artifacts:
    - "reports/repo-maintenance.md"
receipt:
  required: true
  path: "receipts/repo-maintenance.receipt.md"
